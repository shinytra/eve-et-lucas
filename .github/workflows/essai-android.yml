name: Essai Android

# Lance l'APK release (x86_64, mêmes réglages que la version à télécharger)
# sur un émulateur et ouvre le scan du QR code d'appairage : la CI voit ainsi
# un plantage qu'on ne verrait sinon que sur un vrai téléphone.

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "plugins/**"
      - "Cargo.lock"
      - ".github/workflows/essai-android.yml"
      - ".github/scripts/essai-scan-android.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android-x86_64
      - name: Installer la CLI Tauri
        working-directory: apps/desktop/src-tauri
        run: npm ci
      - name: Générer le projet Android
        working-directory: apps/desktop/src-tauri
        run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" npm run tauri -- android init --ci
      - name: Construire l'APK (release, x86_64)
        working-directory: apps/desktop/src-tauri
        run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" npm run tauri -- android build --apk --target x86_64 --ci
      - name: Signer l'APK avec une clé jetable
        working-directory: apps/desktop/src-tauri
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          pass=$(openssl rand -hex 16)
          keytool -genkeypair -keystore "$RUNNER_TEMP/essai.jks" -storetype PKCS12 \
            -storepass "$pass" -alias essai -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Essai" > /dev/null
          unsigned=$(find gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          "$build_tools/zipalign" -P 16 -f 4 "$unsigned" "$RUNNER_TEMP/aligne.apk"
          "$build_tools/apksigner" sign --ks "$RUNNER_TEMP/essai.jks" --ks-pass "pass:$pass" \
            --out "$RUNNER_TEMP/essai.apk" "$RUNNER_TEMP/aligne.apk"
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Démarrer l'émulateur
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          image="system-images;android-34;google_apis;x86_64"
          yes | "$sdk/sdkmanager" --licenses > /dev/null || true
          "$sdk/sdkmanager" "emulator" "platform-tools" "$image" > /dev/null
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo no | "$sdk/avdmanager" create avd -n essai -k "$image" -d pixel_6 --force
          "$ANDROID_HOME/emulator/emulator" -avd essai -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -camera-back emulated -no-snapshot > "$RUNNER_TEMP/emulateur.log" 2>&1 &
          adb wait-for-device
          for i in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 5
          done
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Ouvrir le scan du QR code
        run: bash .github/scripts/essai-scan-android.sh "$RUNNER_TEMP/essai.apk" "$RUNNER_TEMP/essai"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: essai-scan-android
          path: ${{ runner.temp }}/essai
          if-no-files-found: ignore
          retention-days: 7
