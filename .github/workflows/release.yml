name: Version à télécharger

# Construit l'installateur Windows et l'APK Android, puis les publie dans une
# « Release » GitHub (page « Releases » du dépôt), pour les installer sans
# passer par l'onglet Actions.
#
# - Pousser une étiquette `v0.1.0` (ou lancer le workflow à la main depuis
#   l'onglet Actions) publie la version de `tauri.conf.json`.
# - Une PR qui modifie ce fichier construit tout sans rien publier.
# - Publiée sur ce dépôt (public), celui de `couple_core::update::RELEASES_REPO` :
#   l'appli y lit latest.json pour se mettre à jour toute seule.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/release.yml]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows
      - name: Installer la CLI Tauri
        working-directory: apps/desktop/src-tauri
        run: npm ci
      # Sans --features mcp-bridge : le pont MCP n'a pas d'authentification
      # et ne doit jamais se retrouver dans une version distribuée.
      # Mise à jour depuis l'appli : l'installateur est signé (fichier .sig)
      # avec la clé des secrets TAURI_SIGNING_PRIVATE_KEY et
      # TAURI_SIGNING_PRIVATE_KEY_PASSWORD ; l'appli installée vérifie cette
      # signature avec la clé publique de tauri.conf.json. Sans ces secrets,
      # une PR signe avec une clé jetable et une publication échoue.
      - name: Construire l'installateur (NSIS)
        working-directory: apps/desktop/src-tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # createUpdaterArtifacts seulement ici : un build local sans la clé
          # privée reste possible.
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Clé de signature des mises à jour du dépôt utilisée."
            npm run tauri -- build --bundles nsis --ci --config '{"bundle":{"createUpdaterArtifacts":true}}'
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "::warning::Pas de secret TAURI_SIGNING_PRIVATE_KEY : installateur signé avec une clé jetable (PR seulement)."
            key="$RUNNER_TEMP/maj.key"
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$(openssl rand -hex 16)
            npm run tauri -- signer generate -w "$key" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" --ci -f > /dev/null
            export TAURI_SIGNING_PRIVATE_KEY="$key" TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            config=$(jq -cn --arg k "$(cat "$key.pub")" '{bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:$k}}}')
            npm run tauri -- build --bundles nsis --ci --config "$config"
          else
            echo "::error::Secrets TAURI_SIGNING_PRIVATE_KEY et TAURI_SIGNING_PRIVATE_KEY_PASSWORD manquants : impossible de publier une mise à jour pour le PC."
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
      - name: Installer la CLI Tauri
        working-directory: apps/desktop/src-tauri
        run: npm ci
      - name: Générer le projet Android
        working-directory: apps/desktop/src-tauri
        run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" npm run tauri -- android init --ci
      # Icône de l'appli (icône adaptative + toutes densités), préparée dans
      # icons/android par icons/source/generer.py : gen/android est régénéré.
      - name: Poser l'icône de l'appli
        working-directory: apps/desktop/src-tauri
        run: cp -r icons/android/. gen/android/app/src/main/res/
      # Version « release » : code Rust optimisé et sans symboles de débogage
      # (quelques dizaines de Mo au lieu de plusieurs centaines pour --debug).
      # Gradle la produit non signée ; elle est signée à l'étape suivante.
      - name: Construire l'APK (release)
        working-directory: apps/desktop/src-tauri
        run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" npm run tauri -- android build --apk --target aarch64 --ci
      # Clé de signature : secrets ANDROID_KEYSTORE (fichier .jks en base64,
      # alias « eve-et-lucas ») et ANDROID_KEYSTORE_PASSWORD. La même clé à
      # chaque version permet au téléphone d'installer la mise à jour sans
      # désinstaller l'appli. Sans ces secrets, une PR signe avec une clé
      # jetable (pour vérifier la construction) et une publication échoue.
      - name: Signer l'APK
        working-directory: apps/desktop/src-tauri
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          ks="$RUNNER_TEMP/signature.jks"
          trap 'rm -f "$ks"' EXIT
          if [ -n "$KEYSTORE" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$ks"
            echo "Clé de signature du dépôt utilisée."
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            KEYSTORE_PASSWORD=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$ks" -storetype PKCS12 \
              -storepass "$KEYSTORE_PASSWORD" -alias eve-et-lucas \
              -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Essai" > /dev/null
            echo "::warning::Pas de secret ANDROID_KEYSTORE : APK signé avec une clé jetable (PR seulement)."
          else
            echo "::error::Secrets ANDROID_KEYSTORE et ANDROID_KEYSTORE_PASSWORD manquants : impossible de publier un APK qui se mette à jour."
            exit 1
          fi
          export KEYSTORE_PASSWORD
          unsigned=$(find gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          if [ -z "$unsigned" ]; then
            echo "::error::APK release introuvable."
            exit 1
          fi
          # Gradle aligne déjà l'APK (pages de 16 Ko pour Android 15) ;
          # sinon on l'aligne avant de signer.
          if "$build_tools/zipalign" -c -P 16 4 "$unsigned" > /dev/null; then
            cp "$unsigned" "$RUNNER_TEMP/aligne.apk"
          else
            "$build_tools/zipalign" -P 16 -f 4 "$unsigned" "$RUNNER_TEMP/aligne.apk"
          fi
          mkdir -p "$RUNNER_TEMP/apk"
          "$build_tools/apksigner" sign --ks "$ks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias eve-et-lucas --out "$RUNNER_TEMP/apk/eve-et-lucas.apk" "$RUNNER_TEMP/aligne.apk"
          "$build_tools/apksigner" verify --print-certs "$RUNNER_TEMP/apk/eve-et-lucas.apk"
          ls -lh "$RUNNER_TEMP/apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android
          path: ${{ runner.temp }}/apk/eve-et-lucas.apk
          if-no-files-found: error
          retention-days: 7

  publier:
    if: github.event_name != 'pull_request'
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: construit
      # latest.json : dernière version, lue par l'appli pour se mettre à jour
      # (format du plugin updater de Tauri, plus l'entrée android-aarch64 avec
      # l'empreinte SHA-256 de l'APK, voir couple_core::update).
      - name: Préparer les fichiers et latest.json
        run: |
          set -euo pipefail
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "L'étiquette $GITHUB_REF_NAME ne correspond pas à la version $version de tauri.conf.json." >&2
            exit 1
          fi
          repo=$(grep -oP 'RELEASES_REPO: &str = "\K[^"]+' crates/couple-core/src/update.rs)
          # L'appli lit les versions là où elles sont publiées : ce dépôt.
          if [ "$repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::RELEASES_REPO ($repo) n'est pas ce dépôt ($GITHUB_REPOSITORY) : l'appli ne trouverait pas la version."
            exit 1
          fi
          mkdir publie
          exe=$(find construit/windows -name '*.exe' | head -n 1)
          sig=$(find construit/windows -name '*.exe.sig' | head -n 1)
          apk=$(find construit/android -name '*.apk' | head -n 1)
          # Sans signature, aucun PC n'accepterait la mise à jour : on s'arrête.
          for f in "$exe" "$sig" "$apk"; do
            if [ -z "$f" ] || [ ! -s "$f" ]; then
              echo "::error::Installateur, signature (.exe.sig) ou APK manquant."
              exit 1
            fi
          done
          exe_name="Eve-et-Lucas-$version-Windows.exe"
          apk_name="Eve-et-Lucas-$version-Android.apk"
          cp "$exe" "publie/$exe_name"
          cp "$apk" "publie/$apk_name"
          base="https://github.com/$repo/releases/download/$tag"
          jq -n \
            --arg version "$version" \
            --arg notes "Nouvelle version $version d'Eve & Lucas." \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig "$(cat "$sig")" \
            --arg exe "$base/$exe_name" \
            --arg apk "$base/$apk_name" \
            --arg sha "$(sha256sum "publie/$apk_name" | cut -d' ' -f1)" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
               "windows-x86_64": {signature: $sig, url: $exe},
               "android-aarch64": {url: $apk, sha256: $sha}
             }}' > publie/latest.json
          cat publie/latest.json
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "repo=$repo"
          } >> "$GITHUB_OUTPUT"
        id: fichiers
      # Le dépôt est public : l'appli lit latest.json sans mot de passe.
      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.fichiers.outputs.tag }}
          VERSION: ${{ steps.fichiers.outputs.version }}
          REPO: ${{ steps.fichiers.outputs.repo }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" publie/* --clobber --repo "$REPO"
          else
            gh release create "$TAG" publie/* \
              --repo "$REPO" \
              --target "$GITHUB_SHA" \
              --title "Eve & Lucas $VERSION" \
              --notes-file .github/release-notes.md
          fi
