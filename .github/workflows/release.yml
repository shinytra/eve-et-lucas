name: Version à télécharger

# Construit l'installateur Windows et l'APK Android, puis les publie dans une
# « Release » GitHub (page « Releases » du dépôt), pour les installer sans
# passer par l'onglet Actions.
#
# - Pousser une étiquette `v0.1.0` (ou lancer le workflow à la main depuis
#   l'onglet Actions) publie la version de `tauri.conf.json`.
# - Une PR qui modifie ce fichier construit tout sans rien publier.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/release.yml]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows
      - name: Installer la CLI Tauri
        working-directory: apps/desktop/src-tauri
        run: npm ci
      # Sans --features mcp-bridge : le pont MCP n'a pas d'authentification
      # et ne doit jamais se retrouver dans une version distribuée.
      - name: Construire l'installateur (NSIS)
        working-directory: apps/desktop/src-tauri
        run: npm run tauri -- build --bundles nsis --ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
      - name: Installer la CLI Tauri
        working-directory: apps/desktop/src-tauri
        run: npm ci
      # Clé de signature facultative (secret ANDROID_DEBUG_KEYSTORE, fichier
      # debug.keystore en base64) : avec la même clé d'une version à l'autre,
      # le téléphone accepte la mise à jour sans désinstaller l'appli.
      # Sans ce secret, Gradle crée une clé neuve à chaque construction.
      - name: Clé de signature (si configurée)
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android
            printf '%s' "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "Clé de signature commune utilisée."
          else
            echo "Pas de secret ANDROID_DEBUG_KEYSTORE : clé de développement neuve."
          fi
      - name: Générer le projet Android
        working-directory: apps/desktop/src-tauri
        run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" npm run tauri -- android init --ci
      - name: Construire l'APK
        working-directory: apps/desktop/src-tauri
        run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" npm run tauri -- android build --debug --apk --target aarch64 --ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

  publier:
    if: github.event_name != 'pull_request'
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: construit
      - name: Créer la version et y joindre les fichiers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "L'étiquette $GITHUB_REF_NAME ne correspond pas à la version $version de tauri.conf.json." >&2
            exit 1
          fi
          mkdir publie
          exe=$(find construit/windows -name '*.exe' | head -n 1)
          apk=$(find construit/android -name '*.apk' | head -n 1)
          cp "$exe" "publie/Eve-et-Lucas-$version-Windows.exe"
          cp "$apk" "publie/Eve-et-Lucas-$version-Android.apk"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" publie/* --clobber
          else
            gh release create "$tag" publie/* \
              --target "$GITHUB_SHA" \
              --title "Eve & Lucas $version" \
              --notes-file .github/release-notes.md
          fi
