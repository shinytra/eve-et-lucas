name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Sans informations de débogage : le build complet (Tauri + iroh + iroh-blobs)
# dépasse sinon l'espace disque du serveur de GitHub.
env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Libérer de l'espace disque (SDK préinstallés inutiles ici)
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift && df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dépendances système de Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Clippy avec le pont MCP (build de développement)
        run: cargo clippy --workspace --all-targets --features eve-et-lucas-desktop/mcp-bridge -- -D warnings

  # Failles connues (base RustSec), licences et provenance des dépendances.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: deny
      - run: cargo install --locked cargo-deny@0.22.1
      - run: cargo deny check
