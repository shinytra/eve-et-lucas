[workspace]
resolver = "2"
members = [
  "crates/couple-core",
  "crates/couple-sync",
  "apps/desktop/src-tauri",
  "plugins/tauri-plugin-geofence",
  "plugins/tauri-plugin-home-widget",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
automerge = "0.12"
autosurgeon = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
couple-core = { path = "crates/couple-core" }

# Versions distribuées (installateur Windows, APK) : sans symboles de
# débogage, pour des fichiers bien plus légers.
[profile.release]
strip = true
