[package]
name = "eve-et-lucas-desktop"
version = "0.1.0"
description = "Appli PC Eve & Lucas (Tauri 2). Pensée dès le départ pour Android."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# Nom distinct du binaire (exigence Windows) ; staticlib/cdylib pour Android.
name = "eve_et_lucas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
couple-core.workspace = true
couple-sync = { path = "../../../crates/couple-sync" }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["tray-icon"] }
# Pont pour le serveur MCP Tauri (Claude Code voit et pilote l'appli).
# Seulement avec `--features mcp-bridge`, jamais dans une version distribuée.
tauri-plugin-mcp-bridge = { version = "=0.13.2", optional = true }

# Seulement sur PC : tâche de fond, lancement au démarrage, instance unique.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5"
tauri-plugin-single-instance = "2.3"

# Seulement sur téléphone : scanner le QR code d'appairage.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.5"

[features]
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]
