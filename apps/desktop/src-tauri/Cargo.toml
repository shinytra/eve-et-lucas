[package]
name = "eve-et-lucas-desktop"
version = "0.5.0"
publish = false
description = "Appli PC Eve & Lucas (Tauri 2). Pensée dès le départ pour Android."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# Nom distinct du binaire (exigence Windows) ; staticlib/cdylib pour Android.
name = "eve_et_lucas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
couple-core.workspace = true
couple-sync = { path = "../../../crates/couple-sync" }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
data-encoding = "2"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-notification = "2.8"
# Ouvre un morceau dans YouTube Music (appli Android si installée, navigateur sur PC).
tauri-plugin-opener = "2.7"
# HTTPS : réveil par ntfy (PC) et recherche AniList + affiches des animés
# (PC et téléphone). Déjà utilisés par iroh, mêmes options.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
# Date et heure locales avec le fuseau de l'appareil (rappels des dates
# importantes), Android compris. Remplaçant conseillé de chrono (plus maintenu).
jiff = "1"
# Arrivée à la maison (géofencing Android) ; sur PC, chaque appel renvoie une erreur.
tauri-plugin-geofence = { path = "../../../plugins/tauri-plugin-geofence" }
# Widget d'écran d'accueil (Android) ; sur PC, chaque appel est sans effet.
tauri-plugin-home-widget = { path = "../../../plugins/tauri-plugin-home-widget" }
# Menu Partager d'Android (ajout d'une musique) ; sur PC, chaque appel est sans effet.
tauri-plugin-share-target = { path = "../../../plugins/tauri-plugin-share-target" }
# Installeur d'Android pour les mises à jour ; sur PC, chaque appel renvoie une erreur.
tauri-plugin-apk-install = { path = "../../../plugins/tauri-plugin-apk-install" }
# Pont pour le serveur MCP Tauri (Claude Code voit et pilote l'appli).
# Seulement avec `--features mcp-bridge`, jamais dans une version distribuée.
tauri-plugin-mcp-bridge = { version = "=0.13.2", optional = true }

# Seulement sur PC : tâche de fond, lancement au démarrage, instance unique.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5"
tauri-plugin-single-instance = "2.3"
# Mise à jour depuis l'appli : installateur signé, vérifié puis installé.
tauri-plugin-updater = { version = "2.10", default-features = false, features = ["rustls-tls"] }

# Seulement sur téléphone.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# Date des rappels programmés auprès d'Android.
time = "0.3"
# Téléchargement de l'APK de mise à jour dans un fichier.
tokio = { version = "1", features = ["fs", "io-util"] }
# Empreinte de l'APK de mise à jour (déjà dans l'arbre des dépendances).
sha2 = "0.10"

[features]
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]
