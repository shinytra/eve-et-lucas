[package]
name = "tauri-plugin-home-widget"
version = "0.1.0"
publish = false
description = "Widget d'écran d'accueil Android : tâches à faire et dernière arrivée, cases à cocher."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Exigé par `tauri-plugin` : doit être identique au nom du crate.
links = "tauri-plugin-home-widget"

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tauri = { version = "2.12", default-features = false }
