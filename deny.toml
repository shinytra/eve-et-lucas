# Vérifications de cargo-deny (`cargo deny check`) : failles connues,
# licences, doublons et provenance des dépendances.

[graph]
all-features = false

[advisories]
# Une faille connue fait échouer la vérification.
# « Plus maintenu » : signalé seulement pour nos propres crates (les
# dépendances de Tauri et d'iroh en tirent quelques-unes, sans remplaçant).
unmaintained = "workspace"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
